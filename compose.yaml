# NOTE: not tested locally (Docker is not installed on the development machine).
# Usage: cp .env.example .env  (set real API keys)  &&  docker compose up --build
services:
  api:
    build: .
    image: intelligent-document-engine:0.1.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      IDE_DATA_DIR: /data
    volumes:
      - idengine-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Optional local LLM backend. Enable with:
  #   docker compose --profile ollama up
  # and set IDE_LLM_PROVIDER=ollama, IDE_LLM_BASE_URL=http://ollama:11434 in .env.
  ollama:
    image: ollama/ollama:0.3.14
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  idengine-data:
  ollama-models:
